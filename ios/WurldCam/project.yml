name: WurldCam
options:
  bundleIdPrefix: dev.wurld
  deploymentTarget:
    iOS: "17.0"
targets:
  WurldCam:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        # Full-bleed launch art (LaunchScreen.storyboard + Assets.xcassets/
        # LaunchArt): a chair mid-dissolve into a depth point cloud — the app's
        # purpose as a picture, on the same dark navy the viewer clears to.
        # ios/scripts/make-launch-art.sh regenerates it.
        UILaunchStoryboardName: LaunchScreen
        # Guideline 5.1.1 wants the reason and an example of the use, not just a
        # restatement of the permission. Keep this identical to Sources/Info.plist.
        NSCameraUsageDescription: >-
          WurldCam uses the camera and LiDAR scanner to record a 3D capture. Each
          frame's color image, per-pixel depth and camera position are written to
          a file on this device — for example, walking around a chair records a
          short clip you can open on a computer and view in 3D. Recordings stay on
          this device and are never uploaded.
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleDisplayName: WurldCam
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only VP9 via libvpx, no proprietary crypto: declaring the exemption
        # skips the export-compliance questionnaire on every upload.
        ITSAppUsesNonExemptEncryption: false
        # Expose Documents in the Files app so captures other than the most
        # recent one can be retrieved without a Mac.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.wurld.WurldCam
        # Signing: override DEVELOPMENT_TEAM on the xcodebuild command line to
        # build under a different account.
        DEVELOPMENT_TEAM: R5326Y7EZ4
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The synthetic scene backing the simulator's fake sensor must never
        # reach a shipping build; SimulatedSensor.swift is #if-guarded, but an
        # asset catalog compiles regardless, so exclude it for device SDKs.
        EXCLUDED_SOURCE_FILE_NAMES[sdk=iphoneos*]: SimulatedAssets.xcassets
        SWIFT_VERSION: "5.9"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/WurldCam-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/Vendor/include
        # Device and simulator need different slices of the vendored static
        # libs (build both with ios/scripts/build-native.sh [--simulator]).
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: $(SRCROOT)/Vendor/lib
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: $(SRCROOT)/Vendor/lib-sim
        OTHER_LDFLAGS: "-lvpx -lchromapakz -lc++"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
