[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wurld-video"
version = "0.6.0"
description = "Posed sensor video: RGB + per-frame camera pose + intrinsics + bit-exact depth in one playable WebM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "chromapakz>=0.3.1",
    "numpy>=1.24",
    "pillow>=10",
]

[project.scripts]
wurld = "wurld.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
mcap = ["mcap>=1.0"]
record3d = ["pyliblzfse>=0.4"]

[tool.setuptools.packages.find]
include = ["wurld*"]
