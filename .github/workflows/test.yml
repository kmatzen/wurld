name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg (Stray importer tests)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y ffmpeg
          else brew install ffmpeg; fi
      - name: Install
        run: pip install -e ".[dev,mcap,record3d]"
      - name: Test
        run: pytest tests -q

  viewer-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: wurld.js parity checks
        run: npm test
      - name: package publishes cleanly
        run: |
          npm pack
          tar tzf wurld-core-*.tgz
